
name: Build SahlBit APK

on:
  workflow_dispatch:
  push:
    branches: ["development"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAHLBIT_KEYSTORE_BASE64: ${{ secrets.SAHLBIT_KEYSTORE_BASE64 }}
      SAHLBIT_KEYSTORE_PASSWORD: ${{ secrets.SAHLBIT_KEYSTORE_PASSWORD }}
      SAHLBIT_KEY_ALIAS: ${{ secrets.SAHLBIT_KEY_ALIAS }}
      SAHLBIT_KEY_PASSWORD: ${{ secrets.SAHLBIT_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Prepare persistent release signing key
        id: signing
        shell: bash
        run: |
          if [ -n "$SAHLBIT_KEYSTORE_BASE64" ] && [ -n "$SAHLBIT_KEYSTORE_PASSWORD" ] && [ -n "$SAHLBIT_KEY_ALIAS" ] && [ -n "$SAHLBIT_KEY_PASSWORD" ]; then
            echo "$SAHLBIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sahlbit-release.jks"
            echo "SAHLBIT_KEYSTORE_PATH=$RUNNER_TEMP/sahlbit-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: gradle assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: sahlbit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: sahlbit-release-apk
          path: app/build/outputs/apk/release/app-release.apk
